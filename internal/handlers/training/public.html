<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><style>
:root{font:18px/1.5 system-ui,sans-serif;color:#172030;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:0 auto;padding:24px 16px 64px}section{background:white;border:1px solid #d5dce7;border-radius:16px;padding:24px;box-shadow:0 2px 10px #d5dce755}h1{font-size:1.55rem;line-height:1.2}h2{font-size:1.18rem}button{min-height:48px;border:0;border-radius:9px;background:#164b98;color:white;font:inherit;font-weight:600;padding:10px 20px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ff9d2e;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.choice{display:flex;gap:12px;align-items:flex-start;border:2px solid #ccd5e3;border-radius:10px;padding:12px;margin:12px 0;cursor:pointer}.choice:has(input:checked){border-color:#164b98;background:#eef4ff}.choice input{width:22px;height:22px;flex:none;margin:2px 0}.choice span{min-width:0}.training-math{max-width:100%;height:auto;vertical-align:middle}.feedback{padding:14px;border-radius:8px;margin:18px 0}.good{background:#e8f5ec;border:1px solid #2a7042}.bad{background:#fff0ed;border:1px solid #9f3827}.muted{color:#43516a}.hidden{display:none}#message{min-height:1.5em}svg,img{max-width:100%}
</style></head><body><main><section><h1>{{.Title}}</h1><div id="intro"><p>{{.Count}} question(s)</p><button id="start">Commencer</button></div><div id="quiz" class="hidden"><p id="progress" class="muted"></p><p id="instruction"></p><h2 id="question" tabindex="-1"></h2><div id="choices" role="group" aria-label="Propositions"></div><p id="message" role="status" aria-live="polite"></p><button id="validate">Valider</button><button id="next" class="hidden">Question suivante</button></div><div id="end" class="hidden"><h2>Entraînement terminé</h2><p id="score"></p><button id="restart">Recommencer</button></div></section></main><script>
const cards={{.CardsJSON}}; const csrf={{.CSRF}}; let index=0,score=0,locked=false,busy=false;
const el=id=>document.getElementById(id); const show=(id,yes)=>el(id).classList.toggle('hidden',!yes);
function start(){index=0;score=0;show('intro',false);show('end',false);show('quiz',true);draw()}
function draw(){locked=false;busy=false;const c=cards[index];el('progress').textContent=`Question ${index+1} / ${cards.length}`;el('instruction').innerHTML=c.instruction;el('question').innerHTML=c.question;el('choices').replaceChildren();c.answers.forEach((answer,i)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type=c.multiple?'checkbox':'radio';input.value=String(i);input.name='answer';const span=document.createElement('span');span.innerHTML=answer;label.append(input,span);el('choices').append(label)});el('message').textContent='';el('message').className='';show('validate',true);el('validate').disabled=false;show('next',false)}
async function validate(){if(locked||busy)return;const selected=[...document.querySelectorAll('#choices input:checked')].map(x=>Number(x.value));if(!selected.length){el('message').textContent='Sélectionnez au moins une réponse.';return}busy=true;el('validate').disabled=true;try{const response=await fetch(location.pathname+'/check',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({card_id:cards[index].id,selected})});if(!response.ok)throw Error('Réponse indisponible. Réessayez.');const result=await response.json();locked=true;document.querySelectorAll('#choices input').forEach(x=>x.disabled=true);if(result.correct){score++;el('message').textContent='✓ Bonne réponse';el('message').className='feedback good'}else{el('message').textContent='✗ Ce n’est pas la bonne réponse. Bonne réponse : ';result.answers.forEach((i,n)=>{if(n)el('message').append(document.createTextNode(' ; '));const span=document.createElement('span');span.innerHTML=cards[index].answers[i];el('message').append(span)});el('message').className='feedback bad'}show('validate',false);el('next').textContent=index+1<cards.length?'Question suivante':'Voir mon score';show('next',true);el('next').focus()}catch(e){el('message').textContent=e.message;el('validate').disabled=false}finally{busy=false}}
function next(){if(!locked)return;index++;if(index<cards.length){draw();el('question').focus()}else{show('quiz',false);show('end',true);el('score').textContent=`${score} / ${cards.length} réponses correctes — ${Math.round(score*100/cards.length)} %`}}
el('start').onclick=start;el('restart').onclick=start;el('validate').onclick=validate;el('next').onclick=next;
</script></body></html>
