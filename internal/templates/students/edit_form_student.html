{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4"><i class="bi bi-pencil-square me-2"></i> Editer Prénom et Nom</h2>

    <form action="{{ .StudentRoutes.EditURL }}" method="post">
      <input type="hidden" name="student_id" value="{{ .ExtraData.StudentID }}" />

      <div class="mb-3">
        <label class="form-label">Changer prénom:</label>
        <input
          type="text"
          class="form-control"
          name="new_first_name"
          value="{{ .ExtraData.FirstName }}"
          oninput="removeForbiddenCharacters(this)"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Changer nom:</label>
        <input
          type="text"
          class="form-control"
          name="new_last_name"
          value="{{ .ExtraData.LastName }}"
          oninput="removeForbiddenCharacters(this)"
        />
      </div>

      <button type="submit" class="btn btn-primary">
        <i class="bi bi-body-text me-1"></i> Editer
      </button>
    </form>
  </div>
</div>

<script>
  function removeForbiddenCharacters(input) {
    input.value = input.value.replace(/["]/g, "");
  }
</script>
{{ end }}
