{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="container py-4">
  <div class="card shadow-sm mx-auto" style="max-width: 680px">
    <div class="card-body p-4">
      <h1 class="h2 mb-2">Modifier l’élève</h1>
      <p class="text-body-secondary mb-4">
        Modifiez le prénom ou le nom de {{ .Student.FirstName }} {{ .Student.LastName }}.
      </p>

      <form action="{{ .StudentRoutes.EditURL }}" method="post">
        <input type="hidden" name="student_id" value="{{ .Student.ID }}" />

        <div class="mb-3">
          <label class="form-label" for="student-new-first-name">Prénom</label>
          <input
            id="student-new-first-name"
            type="text"
            class="form-control"
            name="new_first_name"
            value="{{ .Student.FirstName }}"
            autocomplete="given-name"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label" for="student-new-last-name">Nom</label>
          <input
            id="student-new-last-name"
            type="text"
            class="form-control"
            name="new_last_name"
            value="{{ .Student.LastName }}"
            autocomplete="family-name"
            required
          />
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
          <a class="btn btn-outline-secondary" href="{{ .Routes.StudentURL }}">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{{ end }}
