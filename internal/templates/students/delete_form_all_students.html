{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4">&#9760; Supprimer tous les élèves ?</h2>

    <form action="{{ .StudentRoutes.DeleteAllStudentURL }}" method="post">
      <input type="hidden" name="class_code_id" value="{{ .ExtraData.ClassCodeID }}" />
      <div class="mb-3">
        <label class="form-label"
          >Es-tu sur de supprimer les élèves appartenant à la classe : {{.ExtraData.ClassCodeName}}.</label
        >
      </div>

      <button type="submit" class="btn btn-danger">
        MWHAHAHAHAH
      </button>
    </form>
  </div>
</div>
{{ end }}
