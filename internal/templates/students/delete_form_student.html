{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="container py-4">
  <div class="card border-danger shadow-sm mx-auto" style="max-width: 640px">
    <div class="card-body p-4">
      <h1 class="h2 mb-3">Supprimer l’élève</h1>
      <p>Vous êtes sur le point de supprimer l’élève suivant :</p>
      <p class="fs-5 fw-semibold text-break">{{ .Student.FirstName }} {{ .Student.LastName }}</p>
      <p class="text-body-secondary">
        Cette action supprimera cet élève de LazyMarking. Cette opération est irréversible.
      </p>

      <form action="{{ .StudentRoutes.DeleteURL }}" method="post">
        <input type="hidden" name="student_id" value="{{ .Student.ID }}" />
        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-danger">Supprimer l’élève</button>
          <a class="btn btn-outline-secondary" href="{{ .Routes.StudentURL }}">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{{ end }}
