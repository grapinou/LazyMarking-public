{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4">&#9760; Supprimer élève ?</h2>

    <form action="{{ .StudentRoutes.DeleteURL }}" method="post">
      <input type="hidden" name="student_id" value="{{ .ExtraData.StudentID }}" />
      <div class="mb-3">
        <label class="form-label"
          >Es-tu sur de supprimer : {{.ExtraData.Student.FirstName}}  {{.ExtraData.Student.LastName}}.</label
        >

      <button type="submit" class="btn btn-danger">
        MWHAHAHAHAH
      </button>
    </form>
  </div>
</div>
{{ end }}
