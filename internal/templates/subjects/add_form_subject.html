{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-6">
      <h1 class="h2 mb-2">Ajouter une matière</h1>
      <p class="text-body-secondary mb-4">Créez une matière pour organiser les questions de votre banque.</p>
      <div class="card shadow-sm">
        <div class="card-body">
          <form action="{{ .SubjectRoutes.AddURL }}" method="post">
            <div class="mb-4">
              <label class="form-label" for="subject">Nom de la matière</label>
              <input id="subject" type="text" class="form-control" name="subject" placeholder="Exemple : Physique" required />
            </div>
            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-primary">Ajouter</button>
              <a class="btn btn-outline-secondary" href="{{ .CancelURL }}">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}
