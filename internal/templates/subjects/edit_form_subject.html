{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-6">
      <h1 class="h2 mb-2">Modifier la matière</h1>
      <p class="text-body-secondary mb-4">Modifiez le nom utilisé pour classer vos questions.</p>
      <div class="card shadow-sm">
        <div class="card-body">
          <form action="{{ .SubjectRoutes.EditURL }}" method="post">
            <input type="hidden" name="subject_id" value="{{ .SubjectContext.ID }}" />
            <div class="mb-4">
              <label class="form-label" for="new_subject">Nom de la matière</label>
              <input id="new_subject" type="text" class="form-control" name="new_subject" value="{{ .SubjectContext.Name }}" required />
            </div>
            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-primary">Enregistrer</button>
              <a class="btn btn-outline-secondary" href="{{ .CancelURL }}">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}
