{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="row justify-content-center py-4">
  <div class="col-12 col-lg-8 col-xl-6">
    <header class="mb-4">
      <h1 class="h2 mb-2">Réinitialiser le mot de passe</h1>
      <p class="text-body-secondary mb-0">Choisissez un nouveau mot de passe pour votre compte.</p>
    </header>
    <div class="card shadow-sm">
      <div class="card-body p-4">
<form action="{{ .Routes.ResetPasswordURL }}" method="post">
  {{ csrfField }}
  <input type="hidden" name="token" value="{{ .ExtraData.Token }}" />
  <div class="mb-3">
    <label class="form-label" for="new_password">Nouveau mot de passe</label>
    <input id="new_password" autocomplete="new-password"
      type="password"
      class="form-control"
      name="new_password"
      oninput="removeForbiddenCharacters(this)"
      required
    />
  </div>

  <div class="d-flex flex-wrap gap-2 mt-4">
    <button type="submit" class="btn btn-primary">Enregistrer le mot de passe</button>
    <a class="btn btn-outline-secondary" href="{{ .Routes.Home }}">Retour à l’accueil</a>
  </div>
</form>
      </div>
    </div>
  </div>
</div>
<script>
  function removeForbiddenCharacters(input) {
    // Remplace les guillemets doubles ou simples par une chaîne vide
    input.value = input.value.replace(/["]/g, "");
  }
</script>
{{ end }}
