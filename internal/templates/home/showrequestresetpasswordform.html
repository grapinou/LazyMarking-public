{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="row justify-content-center py-4">
  <div class="col-12 col-lg-8 col-xl-6">
    <header class="mb-4">
      <h1 class="h2 mb-2">Mot de passe oublié</h1>
      <p class="text-body-secondary mb-0">Renseignez l’adresse e-mail associée à votre compte.</p>
    </header>
    <div class="card shadow-sm">
      <div class="card-body p-4">
<form action="{{ .Routes.SendEmailResetPasswordURL}}" method="post">
  {{ csrfField }}
  <div class="mb-3">
    <label class="form-label" for="email">Adresse e-mail</label>
    <input id="email" autocomplete="email"
      type="text"
      class="form-control"
      name="email"
      oninput="removeForbiddenCharacters(this)"
    />
  </div>

  <div class="d-flex flex-wrap gap-2 mt-4">
    <button type="submit" class="btn btn-primary">Envoyer le lien de réinitialisation</button>
    <a class="btn btn-outline-secondary" href="{{ .Routes.Home }}">Retour à l’accueil</a>
  </div>
</form>
      </div>
    </div>
  </div>
</div>
<script>
  function removeForbiddenCharacters(input) {
    // Remplace les guillemets doubles ou simples par une chaîne vide
    input.value = input.value.replace(/["]/g, "");
  }
</script>
{{ end }}
