{{ define "head" }}
<title>{{ .PageTitle}}</title>
{{end}} {{ define "body" }}

<h2>Connectez-vous :</h2>

<form action="{{ .Routes.LoginURL }}" method="post">
  {{ csrfField }}
  <div class="mb-3">
    <label class="form-label">Nom d'utilisateur :</label>
    <input
      type="text"
      class="form-control"
      name="username"
      oninput="removeForbiddenCharacters(this)"
    />
  </div>

  <div class="mb-3">
    <label class="form-label">Mot de passe :</label>
    <input
      type="password"
      class="form-control"
      name="password"
      oninput="removeForbiddenCharacters(this)"
    />
  </div>

  <button type="submit" class="btn btn-primary">Et z'est parti !</button>
</form>

<script>
  function removeForbiddenCharacters(input) {
    // Remplace les guillemets doubles ou simples par une chaîne vide
    input.value = input.value.replace(/["]/g, "");
  }
</script>
{{ end }}
