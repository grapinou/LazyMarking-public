{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="row justify-content-center py-4">
  <div class="col-12 col-lg-8 col-xl-6">
    <header class="mb-4">
      <h1 class="h2 mb-2">Se connecter</h1>
      <p class="text-body-secondary mb-0">Accédez à vos questions, élèves et évaluations.</p>
    </header>
    <div class="card shadow-sm">
      <div class="card-body p-4">
<form action="{{ .Routes.LoginURL }}" method="post">
  {{ csrfField }}
  <div class="mb-3">
    <label class="form-label" for="username">Nom d’utilisateur</label>
    <input id="username" autocomplete="username"
      type="text"
      class="form-control"
      name="username"
      oninput="removeForbiddenCharacters(this)"
    />
  </div>

  <div class="mb-3">
    <label class="form-label" for="password">Mot de passe</label>
    <input id="password" autocomplete="current-password"
      type="password"
      class="form-control"
      name="password"
      oninput="removeForbiddenCharacters(this)"
    />
  </div>

  <div class="d-flex flex-wrap gap-2 mt-4">
    <button type="submit" class="btn btn-primary">Se connecter</button>
    <a class="btn btn-outline-secondary" href="{{ .Routes.Home }}">Retour à l’accueil</a>
  </div>
</form>
      </div>
    </div>
  </div>
</div>
<script>
  function removeForbiddenCharacters(input) {
    // Remplace les guillemets doubles ou simples par une chaîne vide
    input.value = input.value.replace(/["]/g, "");
  }
</script>
{{ end }}
