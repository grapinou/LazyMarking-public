{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<section class="card border-0 bg-body-tertiary my-4">
  <div class="card-body p-4 p-md-5">
    <h1 class="display-6 mb-3">Préparez et corrigez vos évaluations</h1>
    <p class="lead text-body-secondary mb-4">Créez votre banque de questions, composez vos QCM et corrigez les copies scannées de vos élèves.</p>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-primary" href="{{ .Routes.LoginURL }}">Se connecter</a>
      <a class="btn btn-outline-secondary" href="{{ .Routes.RegisterURL }}">Créer un compte</a>
    </div>
  </div>
</section>
{{ end }}
