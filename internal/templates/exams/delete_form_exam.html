{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="container py-4">
  <div class="card border-danger shadow-sm mx-auto" style="max-width: 640px">
    <div class="card-body p-4">
      <h1 class="h2 mb-3">Supprimer l'évaluation</h1>
      <p>Voulez-vous supprimer cette évaluation&nbsp;?</p>
      <p class="fs-5 fw-semibold text-break">{{ .Exam.Name }}</p>
      <p class="text-body-secondary">
        Une évaluation déjà générée ne peut pas être supprimée.
      </p>

      <form action="{{ .ExamRoutes.DeleteURL }}" method="post">
        <input type="hidden" name="exam_id" value="{{ .Exam.ID }}" />
        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-danger">Supprimer</button>
          <a class="btn btn-outline-secondary" href="{{ .CancelURL }}">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{{ end }}
