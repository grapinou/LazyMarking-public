{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4"><i class="bi bi-pencil-square me-2"></i> Ajouter nom de classe</h2>

    <form action="{{ .ClassCodeRoutes.AddURL }}" method="post">
      <div class="mb-3">
        <label class="form-label">Nouvelle classe :</label>
        <input
          type="text"
          class="form-control"
          name="class_code"
          placeholder="ex: 1ERE33"
          oninput="removeForbiddenCharacters(this)"
        />
      </div>

      <button type="submit" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i> Ajouter
      </button>
    </form>
  </div>
</div>

<script>
  function removeForbiddenCharacters(input) {
    input.value = input.value.replace(/["]/g, "");
  }
</script>
{{ end }}
