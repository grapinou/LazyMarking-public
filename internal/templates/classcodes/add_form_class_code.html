{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="container py-4">
  <div class="card shadow-sm mx-auto" style="max-width: 680px">
    <div class="card-body p-4">
      <h1 class="h2 mb-2">Ajouter une classe</h1>
      <p class="text-body-secondary mb-4">
        Une classe permet de regrouper les élèves pour préparer leurs évaluations.
      </p>

      <form action="{{ .ClassCodeRoutes.AddURL }}" method="post">
        <div class="mb-4">
          <label class="form-label" for="class-code-name">Nom de la classe</label>
          <input
            id="class-code-name"
            type="text"
            class="form-control"
            name="class_code"
            placeholder="Ex. 6e1, 2nde3, Terminale 1"
            required
          />
          <div class="form-text">Utilisez le nom habituel de la classe dans votre établissement.</div>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">Ajouter la classe</button>
          <a class="btn btn-outline-secondary" href="{{ .CancelURL }}">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>

{{ end }}
