{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="container py-4">
  <div class="card shadow-sm mx-auto" style="max-width: 680px">
    <div class="card-body p-4">
      <h1 class="h2 mb-2">Modifier la classe</h1>
      <p class="text-body-secondary mb-4">
        Modifiez le nom actuel « {{ .ClassCode.Name }} ».
      </p>

      <form action="{{ .ClassCodeRoutes.EditURL }}" method="post">
        <input type="hidden" name="class_code_id" value="{{ .ClassCode.ID }}" />
        <div class="mb-4">
          <label class="form-label" for="new-class-code-name">Nom de la classe</label>
          <input
            id="new-class-code-name"
            type="text"
            class="form-control"
            name="new_class_code"
            value="{{ .ClassCode.Name }}"
            required
          />
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
          <a class="btn btn-outline-secondary" href="{{ .CancelURL }}">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>

{{ end }}
