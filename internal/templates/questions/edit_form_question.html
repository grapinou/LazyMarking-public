{{ define "head"}}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}

<main>
  <header class="mb-4">
    <h1 class="h2 mb-2">Modifier la question</h1>
    <p class="text-body-secondary mb-0">
      Modifiez l’énoncé ou la classification de cette question.
    </p>
  </header>

  <form action="{{ .QuestionRoutes.EditURL }}" method="post">
  {{ csrfField }}
    <input type="hidden" name="question_id" value="{{ .ExtraData.QuestionID }}" />

    <section class="card shadow-sm mb-4" aria-labelledby="question-section-title">
      <div class="card-body p-3 p-md-4">
        <h2 id="question-section-title" class="h4 mb-3">Question</h2>
        <div>
          <label class="form-label" for="question-content">Énoncé</label>
          <textarea
            id="question-content"
            name="content"
            class="form-control"
            rows="8"
            required
          >{{ .ExtraData.Question.Content }}</textarea>
        </div>
      </div>
    </section>

    <section class="card shadow-sm mb-4" aria-labelledby="classification-section-title">
      <div class="card-body p-3 p-md-4">
        <h2 id="classification-section-title" class="h4 mb-3">Classification</h2>
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label" for="subject-id">Matière</label>
            <select id="subject-id" class="form-select" name="subjectID">
              {{ range $subject := .ExtraData.Subjects }}
              <option
                value="{{ $subject.ID }}"
                {{ if eq $subject.ID $.ExtraData.Question.SubjectID }}selected{{ end }}
              >
                {{ $subject.Name }}
              </option>
              {{ end }}
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="theme-id">Thème</label>
            <select id="theme-id" class="form-select" name="themeID">
              {{ range $theme := .ExtraData.Themes }}
              <option
                value="{{ $theme.ID }}"
                {{ if eq $theme.ID $.ExtraData.Question.ThemeID }}selected{{ end }}
              >
                {{ $theme.Name }}
              </option>
              {{ end }}
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="year-level-id">Niveau</label>
            <select id="year-level-id" class="form-select" name="yearLevelID">
              {{ range $yearLevel := .ExtraData.YearLevels }}
              <option
                value="{{ $yearLevel.ID }}"
                {{ if eq $yearLevel.ID $.ExtraData.Question.YearLevelID }}selected{{ end }}
              >
                {{ $yearLevel.Name }}
              </option>
              {{ end }}
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="skill-id">Compétence</label>
            <select id="skill-id" class="form-select" name="skillID">
              {{ range $skill := .ExtraData.Skills }}
              <option
                value="{{ $skill.ID }}"
                {{ if eq $skill.ID $.ExtraData.Question.SkillID }}selected{{ end }}
              >
                {{ $skill.Name }}
              </option>
              {{ end }}
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="difficulty-id">Difficulté</label>
            <select id="difficulty-id" class="form-select" name="difficultyID">
              {{ range $difficulty := .ExtraData.Difficulties }}
              <option
                value="{{ $difficulty.ID }}"
                {{ if eq $difficulty.ID $.ExtraData.Question.DifficultyID }}selected{{ end }}
              >
                {{ $difficulty.Name }}
              </option>
              {{ end }}
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="point-id">Points</label>
            <select id="point-id" class="form-select" name="pointID">
              {{ range $point := .ExtraData.Points}}
              <option
                value="{{ $point.ID }}"
                {{ if eq $point.ID $.ExtraData.Question.PointID }}selected{{ end }}
              >
                {{ $point.PointValue }}
              </option>
              {{ end }}
            </select>
          </div>
        </div>
      </div>
    </section>

    <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
      <a class="btn btn-outline-secondary" href="{{ .Routes.QuestionsURL }}">Annuler</a>
      <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
    </div>
  </form>
</main>

{{ end }}
