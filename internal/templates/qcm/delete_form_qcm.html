{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
      <header class="mb-4">
        <h1 class="h2 mb-2">Supprimer le QCM</h1>
        <p class="text-body-secondary mb-0">Cette action supprimera sa composition.</p>
      </header>

      <section class="card border-danger shadow-sm" aria-labelledby="delete-qcm-title">
        <div class="card-body p-4">
          <h2 id="delete-qcm-title" class="h4 text-break">{{ .QCMContext.Name }}</h2>
          <p class="mb-2">Voulez-vous supprimer ce QCM ?</p>
          <p class="text-body-secondary mb-4">
            Les questions de votre banque ne seront pas supprimées.
          </p>

          <form action="{{ .QCMRoutes.DeleteURL }}" method="post">
  {{ csrfField }}
            <input type="hidden" name="qcm_id" value="{{ .QCMContext.ID }}">
            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-danger">Supprimer</button>
              <a class="btn btn-outline-secondary" href="{{ .Routes.QcmURL }}">Annuler</a>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</div>
{{ end }}
