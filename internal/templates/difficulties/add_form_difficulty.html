{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container py-4"><div class="row justify-content-center"><div class="col-12 col-lg-8 col-xl-6">
  <h1 class="h2 mb-2">Ajouter une difficulté</h1>
  <p class="text-body-secondary mb-4">Créez une difficulté pour organiser votre banque de questions.</p>
  <div class="card shadow-sm"><div class="card-body">
    <form action="{{ .DifficultyRoutes.AddURL }}" method="post">
  {{ csrfField }}
      <div class="mb-4">
        <label class="form-label" for="difficulty">Nom de la difficulté</label>
        <input id="difficulty" type="text" class="form-control" name="difficulty" placeholder="Exemple : Facile" required />
      </div>
      <div class="d-flex flex-wrap gap-2"><button type="submit" class="btn btn-primary">Ajouter</button><a class="btn btn-outline-secondary" href="{{ .CancelURL }}">Annuler</a></div>
    </form>
  </div></div>
</div></div></div>
{{ end }}
