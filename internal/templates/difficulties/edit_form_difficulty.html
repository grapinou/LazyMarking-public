{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container py-4"><div class="row justify-content-center"><div class="col-12 col-lg-8 col-xl-6">
  <h1 class="h2 mb-2">Modifier la difficulté</h1>
  <p class="text-body-secondary mb-4">Modifiez le nom utilisé pour caractériser vos questions.</p>
  <div class="card shadow-sm"><div class="card-body">
    <form action="{{ .DifficultyRoutes.EditURL }}" method="post">
  {{ csrfField }}
      <input type="hidden" name="difficulty_id" value="{{ .DifficultyContext.ID }}" />
      <div class="mb-4">
        <label class="form-label" for="new_difficulty">Nom de la difficulté</label>
        <input id="new_difficulty" type="text" class="form-control" name="new_difficulty" value="{{ .DifficultyContext.Name }}" required />
      </div>
      <div class="d-flex flex-wrap gap-2"><button type="submit" class="btn btn-primary">Enregistrer</button><a class="btn btn-outline-secondary" href="{{ .CancelURL }}">Annuler</a></div>
    </form>
  </div></div>
</div></div></div>
{{ end }}
