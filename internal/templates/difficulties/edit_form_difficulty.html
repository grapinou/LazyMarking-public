{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4"><i class="bi bi-pencil-square me-2"></i> Editer difficultée</h2>

    <form action="{{ .DifficultyRoutes.EditURL }}" method="post">
      <input
        type="hidden"
        name="difficulty_id"
        value="{{ .ExtraData.DifficultyID }}"
      />
      <div class="mb-3">
        <label class="form-label">Changer :</label>
        <input
          type="text"
          class="form-control"
          name="new_difficulty"
          value="{{ .ExtraData.Difficulty }}"
          oninput="removeForbiddenCharacters(this)"
        />
      </div>

      <button type="submit" class="btn btn-primary">
        <i class="bi bi-body-text me-1"></i> Editer
      </button>
    </form>
  </div>
</div>

<script>
  function removeForbiddenCharacters(input) {
    input.value = input.value.replace(/["]/g, "");
  }
</script>
{{ end }}
