{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}

<main>
  <header class="mb-4">
    <h1 class="h2 mb-2">Nouvelle variante</h1>
    <p class="text-body-secondary mb-0">
      Ajoutez une formulation alternative à cette question.
    </p>
  </header>

  <section class="card bg-body-tertiary border-0 mb-4" aria-labelledby="main-question-title">
    <div class="card-body p-3 p-md-4">
      <h2 id="main-question-title" class="h6 text-uppercase text-body-secondary mb-2">
        Question principale
      </h2>
      <p class="h5 text-break mb-0">{{ .QuestionContext.Content }}</p>
    </div>
  </section>

  <form action="{{ .AltQuestionRoutes.AddURL }}" method="post">
  {{ csrfField }}
    <input type="hidden" name="question_id" value="{{ .QuestionContext.ID }}" />

    <section class="card shadow-sm mb-4" aria-labelledby="variant-section-title">
      <div class="card-body p-3 p-md-4">
        <h2 id="variant-section-title" class="h4 mb-3">Variante</h2>
        <div>
          <label class="form-label" for="variant-content">Formulation</label>
          <textarea
            id="variant-content"
            name="content"
            class="form-control"
            rows="8"
            required
          ></textarea>
        </div>
      </div>
    </section>

    <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
      <a class="btn btn-outline-secondary" href="{{ .ExtraData.AltQuestionsURL }}">Annuler</a>
      <button type="submit" class="btn btn-primary">Créer la variante</button>
    </div>
  </form>
</main>

{{ end }}
