{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4"><i class="bi bi-trash fs-3"></i> Supprimer ?</h2>

    <form action="{{ .YearLevelRoutes.DeleteURL }}" method="post">
      <input
        type="hidden"
        name="yearlevel_id"
        value="{{ .ExtraData.YearLevelID }}"
      />
      <div class="mb-3">
        <label class="form-label"
          >Es-tu sur de supprimer : {{.ExtraData.YearLevel}}.</label
        >
      </div>

      <button type="submit" class="btn btn-danger">
        C'est mon dernier mot
      </button>
    </form>
  </div>
</div>
{{ end }}
