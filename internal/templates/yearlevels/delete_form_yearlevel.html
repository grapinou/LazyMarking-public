{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container py-4"><div class="row justify-content-center"><div class="col-12 col-lg-8 col-xl-6">
  <h1 class="h2 mb-2">Supprimer le niveau</h1>
  <p class="text-body-secondary mb-4">Cette action concerne uniquement ce niveau.</p>
  <div class="card border-danger shadow-sm"><div class="card-body">
    <h2 class="h5 text-break">{{ .YearLevelContext.Name }}</h2>
    <p class="mb-2">Voulez-vous supprimer ce niveau ?</p>
    <p class="text-body-secondary">Un niveau utilisé par une question ne peut pas être supprimé.</p>
    <form action="{{ .YearLevelRoutes.DeleteURL }}" method="post">
      <input type="hidden" name="yearlevel_id" value="{{ .YearLevelContext.ID }}" />
      <div class="d-flex flex-wrap gap-2"><button type="submit" class="btn btn-danger">Supprimer</button><a class="btn btn-outline-secondary" href="{{ .CancelURL }}">Annuler</a></div>
    </form>
  </div></div>
</div></div></div>
{{ end }}
