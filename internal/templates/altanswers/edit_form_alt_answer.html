{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}

<main>
  <header class="mb-4">
    <h1 class="h2 mb-2">Modifier la réponse</h1>
    <p class="text-body-secondary mb-0">Modifiez le contenu ou la validité de cette réponse.</p>
  </header>

  <div class="d-grid gap-2 mb-4">
    <section class="card bg-body-tertiary border-0" aria-labelledby="main-question-title">
      <div class="card-body p-3 p-md-4">
        <h2 id="main-question-title" class="h6 text-uppercase text-body-secondary mb-2">Question principale</h2>
        <p class="h5 text-break mb-0">{{ .QuestionContext.Content }}</p>
      </div>
    </section>

    <div class="text-center text-body-secondary" aria-hidden="true"><i class="bi bi-arrow-down"></i></div>

    <section class="card border-primary-subtle" aria-labelledby="variant-title">
      <div class="card-body p-3 p-md-4">
        <h2 id="variant-title" class="h6 text-uppercase text-body-secondary mb-2">Variante</h2>
        <p class="h5 text-break mb-0">{{ .VariantContext.Content }}</p>
      </div>
    </section>
  </div>

  <form action="{{ .AltAnswerRoutes.EditURL }}" method="post">
  {{ csrfField }}
    <input type="hidden" name="question_id" value="{{ .QuestionContext.ID }}" />
    <input type="hidden" name="alt_question_id" value="{{ .VariantContext.ID }}" />
    <input type="hidden" name="alt_answer_id" value="{{ .ExtraData.AltAnswerID }}" />

    <section class="card shadow-sm mb-4" aria-labelledby="answer-section-title">
      <div class="card-body p-3 p-md-4">
        <h2 id="answer-section-title" class="h4 mb-3">Réponse</h2>
        <div class="mb-3">
          <label class="form-label" for="answer-content">Contenu de la réponse</label>
          <textarea id="answer-content" name="new_content" class="form-control" rows="6" required>{{ .ExtraData.AltAnswer.Content }}</textarea>
        </div>
        <div>
          <label class="form-label" for="answer-state">Validité</label>
          <select id="answer-state" class="form-select" name="new_state">
            <option value="0" {{ if eq .ExtraData.AltAnswer.State 0 }}selected{{ end }}>Réponse fausse</option>
            <option value="1" {{ if eq .ExtraData.AltAnswer.State 1 }}selected{{ end }}>Réponse vraie</option>
          </select>
        </div>
      </div>
    </section>

    <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
      <a class="btn btn-outline-secondary" href="{{ .ExtraData.AltAnswersURL }}">Annuler</a>
      <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
    </div>
  </form>
</main>

{{ end }}
