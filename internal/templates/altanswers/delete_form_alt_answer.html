{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4"><i class="bi bi-trash fs-3"></i> Supprimer ?</h2>

    <form action="{{ .AltAnswerRoutes.DeleteURL }}" method="post">
      <input
        type="hidden"
        name="question_id"
        value="{{ .ExtraData.QuestionID }}"
      />
      <input
        type="hidden"
        name="alt_question_id"
        value="{{ .ExtraData.AltQuestionID }}"
      />
      <input
        type="hidden"
        name="alt_answer_id"
        value="{{ .ExtraData.AltAnswerID }}"
      />
      <div class="mb-3">
        <label class="form-label">Es-tu sur de supprimer : </label>

        <p>{{ .ExtraData.AltAnswer.Content }}</p>
      </div>

      <button type="submit" class="btn btn-danger">
        C'est mon dernier mot
      </button>
    </form>
  </div>
</div>
{{ end }}
