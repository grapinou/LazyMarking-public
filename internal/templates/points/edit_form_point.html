{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container py-4"><div class="row justify-content-center"><div class="col-12 col-lg-8 col-xl-6">
  <h1 class="h2 mb-2">Modifier la valeur de points</h1>
  <p class="text-body-secondary mb-2">Modifiez la valeur utilisée dans le barème.</p>
  <p class="text-body-secondary mb-4">Modifier cette valeur affectera toutes les questions qui l'utilisent.</p>
  <div class="card shadow-sm"><div class="card-body">
    <form action="{{ .PointRoutes.EditURL }}" method="post">
  {{ csrfField }}
      <input type="hidden" name="point_id" value="{{ .Form.ID }}" />
      <div class="mb-4">
        <label class="form-label" for="new_point">Nombre de points</label>
        <input id="new_point" type="number" class="form-control" name="new_point" min="1" step="1" value="{{ .Form.CurrentValue }}" required />
      </div>
      <div class="d-flex flex-wrap gap-2"><button type="submit" class="btn btn-primary">Enregistrer</button><a class="btn btn-outline-secondary" href="{{ .CancelURL }}">Annuler</a></div>
    </form>
  </div></div>
</div></div></div>
{{ end }}
