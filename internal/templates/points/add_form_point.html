{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4"><i class="bi bi-pencil-square me-2"></i> Ajouter point</h2>

    <form action="{{ .PointRoutes.AddURL }}" method="post">
      <div class="mb-3">
        <label class="form-label">Nouveau point :</label>
        <select class="form-select" name="point">
          {{ range $i := .ExtraData.Seq }}
          <option value="{{ $i }}">{{ $i }}</option>
          {{ end }}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i> Ajouter
      </button>
    </form>
  </div>
</div>
{{ end }}
