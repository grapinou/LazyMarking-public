{{ define "head" }}

{{ end }} {{ define "body" }}

    role="alert"
  >

      <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>
      Hop hop hop !
    </h1>
    <p class="lead">N-O-N, Non :</p>
    <p class="fw-semibold text-danger">{{ .ExtraData.ErrorMessage }}</p>

      ← Oui mon seigneur.
    </a>
  </div>
</div>

{{ end }}
