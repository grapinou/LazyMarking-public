{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="row justify-content-center py-4">
  <div class="col-12 col-lg-8 col-xl-6">
    <header class="mb-4">
      <h1 class="h2 mb-2">Supprimer une année</h1>
      <p class="text-body-secondary mb-0">Paramètres des évaluations.</p>
    </header>
    <div class="card border-danger shadow-sm">
      <div class="card-body p-4">
<form action="{{ .YearRoutes.DeleteURL }}" method="post">
  {{ csrfField }}
  <input type="hidden" name="year_id" value="{{ .ExtraData.YearID }}" />
<p class="h5 text-break">{{ .ExtraData.Year }}</p><p>Voulez-vous supprimer cette année ?</p>
  <div class="d-flex flex-wrap gap-2 mt-4">
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a class="btn btn-outline-secondary" href="{{ .Routes.ExamURL }}/years">Annuler</a>
  </div>
</form>
      </div>
    </div>
  </div>
</div>
{{ end }}
