{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4"><i class="bi bi-trash fs-3"></i> Supprimer année ?</h2>

    <form action="{{ .YearRoutes.DeleteURL }}" method="post">
  {{ csrfField }}
      <input type="hidden" name="year_id" value="{{ .ExtraData.YearID }}" />
      <div class="mb-3">
        <label class="form-label"
          >Es-tu sur de supprimer : {{.ExtraData.Year}}.</label
        >
      </div>

      <button type="submit" class="btn btn-danger">
        C'est mon dernier mot
      </button>
    </form>
  </div>
</div>
{{ end }}
