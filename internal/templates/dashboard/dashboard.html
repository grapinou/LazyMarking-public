{{ define "dashboard.html" }}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    {{ block "head" . }}{{ end }}
  </head>

  <body class="bg-body">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
      <div class="container-xl">
        <a class="navbar-brand fw-semibold" href="{{ .Routes.DashboardURL }}">
          LazyMarking
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Afficher ou masquer la navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.QuestionsURL }}">
                Banque de questions
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.StudentURL }}">
                Élèves
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.QcmURL }}">
                QCM
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.ExamURL }}">
                Évaluations
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.MarkingURL }}">
                Correction
              </a>
            </li>
          </ul>

          <form class="d-flex" method="post" action="{{ .Routes.LogoutURL }}">
            <button class="btn btn-link link-secondary text-decoration-none px-lg-2" type="submit">
              Se déconnecter
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container-xl py-4">
      {{ block "body" . }}{{ end }}
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      (() => {
        const normalizePath = (path) => path.replace(/\/+$/, "") || "/";
        const currentPath = normalizePath(window.location.pathname);

        document.querySelectorAll("[data-section-link]").forEach((link) => {
          const sectionPath = normalizePath(new URL(link.href, window.location.origin).pathname);
          const belongsToSection =
            currentPath === sectionPath || currentPath.startsWith(sectionPath + "/");

          if (belongsToSection) {
            link.classList.add("active");
            link.setAttribute("aria-current", "page");
          }
        });
      })();
    </script>
  </body>
</html>
{{ end }}
