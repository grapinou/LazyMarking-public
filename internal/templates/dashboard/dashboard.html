{{ define "dashboard.html" }}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    {{ block "head" . }}{{ end }}
  </head>

  <body class="bg-body">
    <a class="visually-hidden-focusable btn btn-primary m-2" href="#main-content">Aller au contenu</a>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm" aria-label="Navigation principale">
      <div class="container-xl">
        <a class="navbar-brand fw-semibold" href="{{ .Routes.DashboardURL }}">
          LazyMarking
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Afficher ou masquer la navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.QuestionsURL }}">
                Mes questions
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.LibraryURL }}">Bibliothèque</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.StudentURL }}">
                Élèves
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.QcmURL }}">
                QCM
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.ExamURL }}">
                Évaluations
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-section-link href="{{ .Routes.MarkingURL }}">
                Correction
              </a>
            </li>
            <li class="nav-item"><a class="nav-link" data-section-link href="/dashboard/training">Entraînements</a></li>
            <li class="nav-item"><a class="nav-link" data-section-link href="/dashboard/help">Aide</a></li>
          </ul>

          <form class="d-flex" method="post" action="{{ .Routes.LogoutURL }}">
  {{ csrfField }}
            <button class="btn btn-link link-secondary text-decoration-none px-lg-2" type="submit">
              Se déconnecter
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container-xl py-4" id="main-content" tabindex="-1">
      {{ block "body" . }}{{ end }}
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      (() => {
        const normalizePath = (path) => path.replace(/\/+$/, "") || "/";
        const currentPath = normalizePath(window.location.pathname);

        document.querySelectorAll("[data-section-link]").forEach((link) => {
          const sectionPath = normalizePath(new URL(link.href, window.location.origin).pathname);
          const belongsToSection =
            currentPath === sectionPath || currentPath.startsWith(sectionPath + "/");

          if (belongsToSection) {
            link.classList.add("active");
            link.setAttribute("aria-current", "page");
          }
        });
      })();
    </script>
    <script>
      (() => {
        const buttons = [
          ["$…$", "Mode mathématique", (s) => s || "x", true],
          ["x²", "Exposant", (s) => (s || "x") + "^2"],
          ["xₙ", "Indice", (s) => (s || "x") + "_n"],
          ["a/b", "Fraction", (s) => "(" + (s || "m") + ") / V"],
          ["√x", "Racine carrée", (s) => "sqrt(" + (s || "x") + ")"],
          ["( )", "Parenthèses", (s) => "(" + (s || "x") + ")"],
          ["×", "Multiplication", () => " × "],
          ["÷", "Division", () => " / "],
          ["=", "Égalité", () => " = "],
          ["≈", "Environ égal", () => " ≈ "],
          ["±", "Plus ou moins", () => " ± "],
          ["π", "Pi", () => "pi"],
          ["ρ", "Rho", () => "rho"],
          ["Δ", "Delta", () => "Delta"],
          ["10ⁿ", "Puissance de dix", () => "10^n"],
        ];
        const examples = [
          ["Texte + maths", "La vitesse vaut $v = d / t$."],
          ["Fraction", "$m / V$"],
          ["Puissance et indice", "$v^2$  ·  $E_c$"],
          ["Racine", "$sqrt(x)$"],
          ["Lettres grecques", "$rho$  ·  $Delta$  ·  $pi$"],
          ["Parenthèses", "$(a+b) / c$"],
          ["Unité à plusieurs lettres", "$V = 60 \"mL\"$"],
        ];

        function inMath(value, position) {
          let open = false;
          for (let i = 0; i < position; i++) {
            if (value[i] === "\\" && value[i + 1] === "$") { i++; continue; }
            if (value[i] === "$") open = !open;
          }
          return open;
        }

        document.querySelectorAll("textarea[data-math-input]").forEach((field) => {
          const bar = document.createElement("div");
          bar.className = "d-flex flex-wrap align-items-center gap-1 mb-2";
          bar.setAttribute("role", "group");
          bar.setAttribute("aria-label", "Insérer une formule Typst dans " + (field.labels?.[0]?.textContent || "le champ"));
          buttons.forEach(([label, title, build, mode]) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "btn btn-sm btn-outline-secondary";
            button.textContent = label;
            button.title = title;
            button.setAttribute("aria-label", title);
            button.addEventListener("click", () => {
              const start = field.selectionStart;
              const end = field.selectionEnd;
              const selection = field.value.slice(start, end);
              let fragment = build(selection);
              if (!inMath(field.value, start)) fragment = "$" + fragment + "$";
              else if (mode) fragment = selection || "x";
              field.setRangeText(fragment, start, end, "end");
              field.focus();
              if (!selection) {
                const placeholder = mode ? "x" : label === "a/b" ? "m" : label === "10ⁿ" ? "n" : label === "√x" ? "x" : null;
                if (placeholder) {
                  const offset = fragment.indexOf(placeholder);
                  if (offset >= 0) field.setSelectionRange(start + offset, start + offset + placeholder.length);
                }
              }
              field.dispatchEvent(new Event("input", { bubbles: true }));
            });
            bar.append(button);
          });
          field.before(bar);

          const help = document.createElement("details");
          help.className = "form-text mt-2";
          const summary = document.createElement("summary");
          summary.className = "text-primary-emphasis";
          summary.textContent = "Aide formules Typst";
          help.append(summary);
          const intro = document.createElement("p");
          intro.className = "mb-1";
          intro.textContent = "Entourez une formule avec $…$. Le reste est du texte ordinaire. Les parenthèses groupent les termes ; une unité de plusieurs lettres s’écrit entre guillemets dans la formule.";
          help.append(intro);
          const list = document.createElement("ul");
          list.className = "mb-0 ps-3";
          examples.forEach(([name, value]) => {
            const item = document.createElement("li");
            item.textContent = name + " : ";
            const code = document.createElement("code");
            code.textContent = value;
            item.append(code);
            list.append(item);
          });
          help.append(list);
          field.after(help);
        });
      })();
    </script>
  </body>
</html>
{{ end }}
