{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="row justify-content-center py-4">
  <div class="col-12 col-lg-8 col-xl-6">
    <header class="mb-4">
      <h1 class="h2 mb-2">Ajouter une période</h1>
      <p class="text-body-secondary mb-0">Paramètres des évaluations.</p>
    </header>
    <div class="card shadow-sm">
      <div class="card-body p-4">
<form action="{{ .PeriodRoutes.AddURL }}" method="post">
  {{ csrfField }}
  <div class="mb-4">
  <label class="form-label" for="period">Nom de la période</label>
  <input id="period" type="text" class="form-control" name="period" placeholder="Exemple : Premier trimestre" oninput="removeForbiddenCharacters(this)" />
</div>
  <div class="d-flex flex-wrap gap-2 mt-4">
    <button type="submit" class="btn btn-primary">Ajouter</button>
    <a class="btn btn-outline-secondary" href="{{ .Routes.ExamURL }}/periods">Annuler</a>
  </div>
</form>
      </div>
    </div>
  </div>
</div>
<script>
  function removeForbiddenCharacters(input) {
    input.value = input.value.replace(/["]/g, "");
  }
</script>
{{ end }}
