{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <h2 class="mb-4"><i class="bi bi-pencil-square me-2"></i> Ajouter Réponse</h2>

  <form action="{{ .ExtraData.AddURL }}" method="post">
    <div class="col-md-2">
      <div class="container mt-5">
        <label class="form-label">Status :</label>
        <select class="form-select" name="state">
          <option value="false">Faux</option>
          <option value="true">Vrai</option>
        </select>
      </div>
    </div>

    <div class="container mt-5">
      <label class="form-label">Ecrire la réponse :</label>
      <textarea
        name="content"
        class="form-control"
        rows="5"
        oninput="removeForbiddenCharacters(this)"
      ></textarea>
    </div>

    <div class="container mt-5">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i> Ajouter
      </button>
    </div>
  </form>
</div>

<script>
  function removeForbiddenCharacters(input) {
    input.value = input.value.replace(/["]/g, "");
  }
</script>
{{ end }}
