{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}

<main>
  <header class="mb-4">
    <h1 class="h2 mb-2">Nouvelle réponse</h1>
    <p class="text-body-secondary mb-0">
      Ajoutez une réponse proposée pour cette question.
    </p>
  </header>

  <section class="card bg-body-tertiary border-0 mb-4" aria-labelledby="main-question-title">
    <div class="card-body p-3 p-md-4">
      <h2 id="main-question-title" class="h6 text-uppercase text-body-secondary mb-2">
        Question principale
      </h2>
      <p class="h5 text-break mb-0">{{ .QuestionContext.Content }}</p>
    </div>
  </section>

  <form action="{{ .AnswerRoutes.AddURL }}" method="post">
    <input type="hidden" name="question_id" value="{{ .QuestionContext.ID }}" />

    <section class="card shadow-sm mb-4" aria-labelledby="answer-section-title">
      <div class="card-body p-3 p-md-4">
        <h2 id="answer-section-title" class="h4 mb-3">Réponse</h2>

        <div class="mb-3">
          <label class="form-label" for="answer-content">Contenu de la réponse</label>
          <textarea
            id="answer-content"
            name="content"
            class="form-control"
            rows="6"
            required
          ></textarea>
        </div>

        <div>
          <label class="form-label" for="answer-state">Validité</label>
          <select id="answer-state" class="form-select" name="state">
            <option value="0">Réponse fausse</option>
            <option value="1">Réponse vraie</option>
          </select>
        </div>
      </div>
    </section>

    <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
      <a class="btn btn-outline-secondary" href="{{ .ExtraData.AnswersURL }}">Annuler</a>
      <button type="submit" class="btn btn-primary">Créer la réponse</button>
    </div>
  </form>
</main>

{{ end }}
