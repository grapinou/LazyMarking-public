{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
      <header class="mb-4">
        <h1 class="h2 mb-2">Supprimer la réponse</h1>
        <p class="text-body-secondary mb-0">Cette action supprimera cette réponse de la question.</p>
      </header>

      <section class="card border-danger shadow-sm" aria-labelledby="delete-answer-title">
        <div class="card-body p-4">
          <h2 id="delete-answer-title" class="h4 text-break">{{ .ExtraData.Answer.Content }}</h2>
          <p class="mb-4">Voulez-vous supprimer cette réponse ?</p>
          <form action="{{ .AnswerRoutes.DeleteURL }}" method="post">
  {{ csrfField }}
            <input type="hidden" name="answer_id" value="{{ .ExtraData.AnswerID }}" />
            <input type="hidden" name="question_id" value="{{ .ExtraData.QuestionID }}" />
            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-danger">Supprimer la réponse</button>
              <a class="btn btn-outline-secondary" href="{{ .ExtraData.CancelURL }}">Annuler</a>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</div>
{{ end }}
