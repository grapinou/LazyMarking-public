{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4">
      <i class="bi bi-pencil-square me-2"></i> Editer taille de l'image
    </h2>

    <form action="{{ .ImageRoutes.EditURL }}" method="post">
      <input
        type="hidden"
        name="question_id"
        value="{{ .ExtraData.QuestionID }}"
      />
      <div class="mb-3">
        <label class="form-label"
          >Pourcentage de redimmensionnent : saisisser un entier</label
        >
        <input
          type="number"
          class="form-control"
          name="width"
          value="{{.ExtraData.ImageSize}}"
        />
      </div>

      <button type="submit" class="btn btn-primary">
        <i class="bi bi-body-text me-1"></i> Editer
      </button>
    </form>
  </div>
</div>

{{ end }}
