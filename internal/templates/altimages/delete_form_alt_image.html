{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4"><i class="bi bi-trash fs-3"></i> Supprimer</h2>

    <form action="{{ .AltImageRoutes.DeleteURL }}" method="post">
      <input
        type="hidden"
        name="question_id"
        value="{{ .QuestionContext.ID }}"
      />

      <input
        type="hidden"
        name="alt_question_id"
        value="{{ .VariantContext.ID }}"
      />

      <div class="mb-3">
        <label class="form-label"
          >Es-tu sur de supprimer l'image de la question alt ?
        </label>
      </div>

      <button type="submit" class="btn btn-danger">
        C'est mon dernier mot
      </button>
    </form>
  </div>
</div>
{{ end }}
