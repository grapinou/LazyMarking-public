{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }} {{ define "body" }}
<div class="container mt-5">
  <div class="col-md-6">
    <h2 class="mb-4"><i class="bi bi-trash fs-3"></i> Supprimer question du qcm ?</h2>

    <form action="{{ .QCMQuestionRoutes.DeleteURL }}" method="post">
      <input
        type="hidden"
        name="qcm_id"
        value="{{ .QCMContext.ID }}"
      />
      <input
        type="hidden"
        name="qcm_question_id"
        value="{{ .ExtraData.QCMQuestionID }}"
      />

      <div class="mb-3">
        <label class="form-label">Es-tu sur de supprimer du qcm la question :</label>

        <p>{{ .ExtraData.QuestionContent }}</p>
      </div>

      <button type="submit" class="btn btn-danger">
        C'est mon dernier mot
      </button>
    </form>
  </div>
</div>
{{ end }}
