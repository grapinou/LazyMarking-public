{{ define "head" }}
<title>{{ .PageTitle }}</title>
{{ end }}

{{ define "body" }}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
      <header class="mb-4">
        <h1 class="h2 mb-2">Retirer la question du QCM</h1>
        <p class="text-body-secondary mb-0 text-break">{{ .QCMContext.Name }}</p>
      </header>

      <section class="card border-danger shadow-sm" aria-labelledby="remove-question-title">
        <div class="card-body p-4">
          <h2 id="remove-question-title" class="h5 mb-3">Question concernée</h2>
          <p class="text-break mb-4">{{ .Removal.QuestionContent }}</p>
          <p>Voulez-vous retirer cette question du QCM ?</p>
          <p class="text-body-secondary mb-4">
            La question restera disponible dans votre banque.
          </p>

          <form action="{{ .QCMQuestionRoutes.DeleteURL }}" method="post">
            <input type="hidden" name="qcm_id" value="{{ .QCMContext.ID }}">
            <input type="hidden" name="qcm_question_id" value="{{ .Removal.QCMQuestionID }}">
            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-danger">Retirer</button>
              <a class="btn btn-outline-secondary" href="{{ .Removal.CancelURL }}">Annuler</a>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</div>
{{ end }}
